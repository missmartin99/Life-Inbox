# Private-beta local composition. Does NOT publicly deploy or purchase infra.
# Secrets come from a .env file next to this one (see docs/deploy-oracle.md).
# Ports are bound to 127.0.0.1 so the database and app are not reachable from
# other machines directly; on a server, Caddy (deploy/) is the only way in.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifeinbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeinbox}
      POSTGRES_DB: lifeinbox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LIFE_INBOX_ENV: beta
      DATABASE_URL: postgresql+psycopg://lifeinbox:${POSTGRES_PASSWORD:-lifeinbox}@db:5432/lifeinbox
      LIFE_INBOX_UPLOAD_DIR: /data/uploads
      LIFE_INBOX_SESSION_SECRET: ${LIFE_INBOX_SESSION_SECRET:-change-me-to-a-long-random-secret-value}
      LIFE_INBOX_ALLOW_DEV_LOGIN: ${LIFE_INBOX_ALLOW_DEV_LOGIN:-0}
      LIFE_INBOX_AUTH_MODE: google_stub
      LIFE_INBOX_TIMEZONE: ${LIFE_INBOX_TIMEZONE:-UTC}
      LIFE_INBOX_EMBEDDINGS: "1"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - db

volumes:
  pgdata:
  uploads:
