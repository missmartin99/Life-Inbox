<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Life Inbox</title>
  <style>
    :root { --bg:#f7f8fa; --card:#fff; --text:#111; --muted:#5b6470; --accent:#2f6f84; --error:#b42318; --border:#e3e6ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171a; --card:#1d2125; --text:#f2f4f6; --muted:#a3acb7; --accent:#4a9bb5; --error:#ff8a80; --border:#2d3339; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px; }
    main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border);
           border-radius:16px; padding:32px 28px; text-align:center; }
    h1 { margin:0 0 8px; font-size:28px; }
    p { color:var(--muted); margin:0 0 24px; line-height:1.5; }
    .btn { display:block; padding:12px 16px; border-radius:10px; background:var(--accent);
           color:#fff; font-weight:600; text-decoration:none; }
    .error { color:var(--error); font-weight:600; min-height:1.2em; margin:0 0 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Life Inbox</h1>
    <p>Capture first. Organize when you are ready.</p>
    <p class="error" role="alert">__ERROR__</p>
    __BUTTON__
  </main>
</body>
</html>
